# Codex Configuration Template

[model]
name = "codex-placeholder"

# Presets
[presets.coding-strict]
temperature = 0.1
topP = 0.3

[presets.review-strict]
temperature = 0.0
topP = 0.5

[presets.frontend-balanced]
temperature = 0.2
topP = 0.9

[presets.research-wide]
temperature = 0.4
topP = 0.95

# Permissions
[permissions]
file_read = "allow"
file_write_workspace = "allow"
shell = "ask"
delete = "ask"
network = "ask"
git_commit_push = "ask"

# API Settings
api_key = "CODEX_API_KEY_PLACEHOLDER"
